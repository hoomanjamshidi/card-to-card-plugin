# Local test site: WordPress + WooCommerce + this plugin (mounted live) on http://localhost:8890
# (admin / password). Start with `npm run env` (bin/dev.sh up); WP-CLI: `bin/dev.sh wp …`.
name: card-to-card

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ctc
  WORDPRESS_DB_USER: ctc
  WORDPRESS_DB_PASSWORD: ctc
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'FS_METHOD', 'direct' );

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ctc
      MARIADB_USER: ctc
      MARIADB_PASSWORD: ctc
      MARIADB_ROOT_PASSWORD: ctc-root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${CTC_PORT:-8890}:80"
    environment: *wp-env
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/card-to-card

  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    environment: *wp-env
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/card-to-card

volumes:
  db:
  wp:
